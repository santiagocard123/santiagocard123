name: Profile metrics

on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jottysng
          filename: metrics.summary.svg
          output_action: commit
          committer_message: 'chore: refresh stats and languages [skip ci]'
          template: classic
          base: header, repositories
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          config_timezone: America/Bogota
          config_animations: no

      - name: Activity Pulse
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          git pull --ff-only origin main
          python3 scripts/build_activity_pulse.py
          git add metrics.activity.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh public activity pulse [skip ci]'
            git push origin HEAD:main
          fi
