name: Profile metrics

on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Stats and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jottysng
          filename: metrics.summary.svg
          output_action: commit
          committer_message: 'chore: refresh stats and languages [skip ci]'
          template: classic
          color: gray-dark
          base: header, repositories
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          config_timezone: America/Bogota
          config_animations: no

      - name: Activity Pulse
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jottysng
          filename: metrics.activity.svg
          output_action: commit
          committer_message: 'chore: refresh activity pulse [skip ci]'
          template: classic
          color: gray-dark
          base: ''
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 365
          plugin_activity_visibility: public
          plugin_activity_filter: all
          plugin_traffic: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: America/Bogota
          config_padding: 0, 8 + 4%
          config_animations: no
